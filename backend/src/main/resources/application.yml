server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: careerpilot-backend

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/careerpilot_dev}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 3000
      # Non-blocking pool initialization: allows backend and health check to run even before Supabase DB is provisioned
      initialization-fail-timeout: -1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: false
        temp:
          use_jdbc_metadata_defaults: false
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true

# Application-specific properties
careerpilot:
  supabase:
    # Option A: HMAC-SHA256 Secret (found in Supabase Settings > API > JWT Settings)
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    # Option B: JWKS URI for RS256/ES256 asymmetric keys (https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json)
    jwk-set-uri: ${SUPABASE_JWT_JWK_SET_URI:}
    # Option C: Issuer URI (https://<project-ref>.supabase.co/auth/v1)
    issuer-uri: ${SUPABASE_AUTH_ISSUER_URI:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
